{% extends "base.html" %}
{% import "_ui.html" as ui with context %}
{% block crumb %}{{ ui.c(_("Error") ~ " " ~ status) }}{% endblock %}
{% block content %}
<section class="panel">
  <div class="panel-h"><h2>{{ _("Error") }} {{ status }}</h2></div>
  <div class="panel-b">
    <div class="notice error">{{ _(detail) }}</div>
    <p><a class="btn" href="/">{{ _("Go to Dashboard") }}</a></p>
  </div>
</section>
{% endblock %}
