{% extends "base.html" %}
{% import "_ui.html" as ui with context %}
{% block shell %}
<div class="auth">
  <div class="auth-card">
    <div class="head">
      <h1>{% block heading %}{% endblock %}</h1>
      <p>{% block lead %}{% endblock %}</p>
    </div>
    {% block form %}{% endblock %}
  </div>
  <div class="auth-lang">{{ ui.lang_switch() }}</div>
</div>
{% endblock %}
